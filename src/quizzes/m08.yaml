title: Evals & observability
questions:
  - id: m08q1
    type: single
    prompt: Why do AI systems need evals over many examples, rather than a single test case?
    choices:
      - Because models are slow
      - Because outputs are non-deterministic, sensitive to changes and graded on a spectrum
      - Because single tests are illegal
      - Because evals are cheaper than tests
    answer: 1
    explanation: You measure rates across many examples, not pass/fail on one run.
  - id: m08q2
    type: single
    prompt: What is the best first source of eval examples?
    choices:
      - Thousands of synthetic examples generated by AI
      - Real inputs and known failures from the workflow
      - Public benchmark questions
      - Examples written to make the system look good
    answer: 1
    explanation: Real inputs and failures you understand deeply are the most valuable.
  - id: m08q3
    type: multi
    prompt: Which make an LLM judge more reliable?
    choices:
      - One criterion per judge with pass/fail output
      - Reasoning before the verdict
      - Calibrating against human expert labels
      - Asking for an overall 1–10 quality score
    answer: [0, 1, 2]
    explanation: Broad 1–10 scales are less reliable than focused, binary criteria.
  - id: m08q4
    type: single
    prompt: You tuned your prompt until all 30 eval examples pass, but users report no improvement. What likely happened?
    choices:
      - Overfitting to the eval set
      - The model got smarter
      - The judge is perfect
      - Users are wrong
    answer: 0
    explanation: Keep a held-out set you don't tune on and refresh examples from production.
  - id: m08q5
    type: multi
    prompt: Which are effective ways to reduce AI cost?
    choices:
      - Use smaller models for simple steps
      - Structure prompts so stable parts can benefit from prompt caching
      - Use batch APIs for non-urgent work
      - Retrieve as many chunks as fit in the window
    answer: [0, 1, 2]
    explanation: Trimming context, not maximising it, lowers cost.
  - id: m08q6
    type: single
    prompt: For grading an agent that should close a ticket and email the customer, what is most trustworthy?
    choices:
      - The agent's final message saying it's done
      - A code check of the final state (ticket closed, email sent)
      - The number of tokens used
      - How confident the agent sounds
    answer: 1
    explanation: Check outcomes in the real state, not the agent's claims.
