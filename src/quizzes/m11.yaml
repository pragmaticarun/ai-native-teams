title: Operating model & change
questions:
  - id: m11q1
    type: single
    prompt: What's the difference between a maturity ladder and a capability map?
    choices:
      - There is none
      - Ladders help say where you are; capability maps help decide what to fix next
      - Ladders are only for engineers
      - Maps are always more accurate
    answer: 1
    explanation: Use one of each, and remember their caveats.
  - id: m11q2
    type: single
    prompt: Who makes the best AI champions?
    choices:
      - Whoever is most excited about new tools
      - Respected practitioners across functions, with recognised time for the role
      - Only engineers
      - External consultants
    answer: 1
    explanation: Peers trust colleagues who know the work.
  - id: m11q3
    type: single
    prompt: A manager wants to rank individuals by AI tool usage telemetry. What's the likely effect?
    choices:
      - Better outcomes
      - Gaming and fear, undermining honest experimentation
      - Nothing
      - Lower costs
    answer: 1
    explanation: Measure team outcomes, not individual usage.
  - id: m11q4
    type: multi
    prompt: Which help protect learning for early-career people?
    choices:
      - Explaining AI-produced work in their own words before shipping
      - Attempting some tasks alone first, then comparing with AI
      - Never letting them use AI
      - Reviewing AI output together with a senior
    answer: [0, 1, 3]
    explanation: The goal is building judgment, not banning tools.
  - id: m11q5
    type: single
    prompt: Why include a "failure" demo in AI show-and-tell?
    choices:
      - To embarrass people
      - To make it safe to share what doesn't work, which speeds up team learning
      - Because wins are rare
      - To slow adoption
    answer: 1
    explanation: Psychological safety and shared failure modes are core to learning.
  - id: m11q6
    type: single
    prompt: In a hub-and-spoke model, what typically belongs to the central hub?
    choices:
      - Every team's domain prompts
      - Approved tools, platform, security and legal review, shared infrastructure
      - Day-to-day workflow redesign for each team
      - Individual performance reviews
    answer: 1
    explanation: Teams own their workflows; the hub makes it safe and cheap.
